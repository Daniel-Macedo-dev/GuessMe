name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: guessme/package-lock.json

      - name: Install dependencies
        working-directory: guessme
        run: npm ci

      - name: Lint
        working-directory: guessme
        run: npm run lint

      - name: Build
        working-directory: guessme
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: guessme-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080
