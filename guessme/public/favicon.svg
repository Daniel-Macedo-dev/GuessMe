<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- GuessMe — investigation mark / dossier seal favicon -->
  <!-- Obsidian background with app-icon rounding -->
  <rect width="32" height="32" rx="6" fill="#070b0f"/>
  <!-- Dossier seal outer ring — ties to BrandMark.tsx identity -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#34d399" stroke-width="0.5" stroke-opacity="0.35"/>
  <!-- Magnifying glass: lens (investigation motif) -->
  <circle cx="13" cy="13" r="6.5" fill="none" stroke="#34d399" stroke-width="2.2"/>
  <!-- Magnifying glass: handle -->
  <line x1="18" y1="18" x2="24.5" y2="24.5" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
</svg>
